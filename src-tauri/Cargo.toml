[package]
name = "mothball"
version = "0.8.0"
description = "Mothball — local project, file and knowledge manager"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "mothball_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# used by tauri::generate_context!() for plugin configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Supplies SQLite (compiled from source, FTS5 enabled) to vault-core's FFI layer.
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
vault-core = { path = "../crates/vault-core", default-features = false }
# TLS for the read-only Bambu printer connection (see crates/bambu-tls)
bambu-tls = { path = "../crates/bambu-tls" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
