name: Release

# Run it from the Actions tab (or push a tag like v0.2.0). It builds the signed Windows installer and publishes
# a GitHub Release with latest.json, which installed copies of Mothball
# check to update themselves.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/vault-stress
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # from tauri.conf.json, so a manual run gets the right tag too
          releaseName: Mothball v__VERSION__
          releaseBody: See the commit history for what changed. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
      # The stress test as a standalone .exe: double-click it to run a full test.
      - name: Attach vault-stress.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release --manifest-path crates/vault-stress/Cargo.toml
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          gh release upload "v$v" crates/vault-stress/target/release/vault-stress.exe --clobber
