name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  core-and-ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Core unit tests
        run: cargo test --manifest-path crates/vault-core/Cargo.toml
      - name: Printer TLS tests
        run: cargo test --manifest-path crates/bambu-tls/Cargo.toml
      - name: Save/restore stress test
        run: |
          cargo build --release --manifest-path crates/vault-core/Cargo.toml --bin vault-stress
          crates/vault-core/target/release/vault-stress --rounds 1500 --seed 1
          crates/vault-core/target/release/vault-stress --rounds 1500 --seed 2
          crates/vault-core/target/release/vault-stress --crash 15 --seed 3
      - name: Build dev server
        run: cargo build --manifest-path crates/vault-core/Cargo.toml --bin vault-devserver
      - run: npm install
      - name: Type-check UI
        run: npm run typecheck
      - name: Build UI
        run: npm run build:ui
      - run: npx playwright install --with-deps chromium
      - name: End-to-end UI test
        run: node scripts/ui-smoke.mjs --shots ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-screenshots, path: ui-shots }

  # Windows file-system behaviour (case-insensitive names, replace-on-rename,
  # the Recycle Bin, long paths) — the platform Mothball ships on.
  windows-stress:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Save/restore stress test on Windows
        shell: pwsh
        run: |
          cargo build --release --manifest-path crates/vault-stress/Cargo.toml
          $exe = "crates/vault-stress/target/release/vault-stress.exe"
          & $exe --rounds 600 --seed 1; if ($LASTEXITCODE) { exit 1 }
          & $exe --rounds 600 --seed 2 --long-paths; if ($LASTEXITCODE) { exit 1 }
          & $exe --crash 10 --seed 3; if ($LASTEXITCODE) { exit 1 }
